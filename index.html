<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amde-ዋንጫ</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-colors {
            0% { color: #16a34a; } /* Green */
            50% { color: #ca8a04; } /* Yellow */
            100% { color: #dc2626; } /* Red */
        }
        .animate-amde { animation: pulse-colors 3s infinite; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const AmdeWancha = () => {
            const [screen, setScreen] = useState('auth');
            const [isLogin, setIsLogin] = useState(false);
            const [selectedSquare, setSelectedSquare] = useState(null);

            // ዳማ ሰሌዳ አጀማመር
            const [board, setBoard] = useState(() => {
                let b = Array(64).fill(null);
                for (let i = 0; i < 64; i++) {
                    const row = Math.floor(i / 8);
                    const col = i % 8;
                    if ((row + col) % 2 !== 0) {
                        if (row < 3) b[i] = 'red';
                        if (row > 4) b[i] = 'white';
                    }
                }
                return b;
            });

            const handleMove = (i) => {
                if (selectedSquare === null) {
                    if (board[i]) setSelectedSquare(i);
                } else {
                    const newBoard = [...board];
                    newBoard[i] = board[selectedSquare];
                    newBoard[selectedSquare] = null;
                    setBoard(newBoard);
                    setSelectedSquare(null);
                }
            };

            if (screen === 'auth') return (
                <div class="flex flex-col items-center justify-center min-h-screen p-4">
                    <h1 class="text-6xl font-black mb-8 animate-amde">Amde-ዋንጫ</h1>
                    <div class="w-full max-w-md bg-white p-8 rounded-[2rem] shadow-2xl border-b-[10px] border-yellow-500">
                        <div class="flex mb-6 bg-gray-100 rounded-xl p-1">
                            <button onClick={() => setIsLogin(false)} class={`flex-1 py-2 rounded-lg font-bold ${!isLogin ? 'bg-white text-orange-600 shadow' : 'text-gray-500'}`}>Sign Up</button>
                            <button onClick={() => setIsLogin(true)} class={`flex-1 py-2 rounded-lg font-bold ${isLogin ? 'bg-white text-orange-600 shadow' : 'text-gray-500'}`}>Login</button>
                        </div>
                        <div class="space-y-4">
                            {!isLogin && <input type="text" placeholder="ሙሉ ስም" class="w-full p-4 border rounded-2xl outline-none focus:border-orange-400" />}
                            <input type="text" placeholder="የስልክ ቁጥር (10 ዲጂት)" class="w-full p-4 border rounded-2xl outline-none" />
                            <input type="password" placeholder="ሚስጥር ቃል (6 ዲጂት)" class="w-full p-4 border rounded-2xl outline-none" />
                            <button onClick={() => setScreen('dashboard')} class="w-full bg-orange-500 text-white p-4 rounded-2xl font-black text-xl shadow-lg">ግባ</button>
                        </div>
                    </div>
                </div>
            );

            if (screen === 'dashboard') return (
                <div class="p-6 max-w-4xl mx-auto text-center">
                    <h1 class="text-4xl font-black mb-6 text-gray-800">አምደ-ዋንጫ</h1>
                    <div class="bg-green-100 text-green-700 px-6 py-2 rounded-full inline-block mb-10 font-bold border border-green-300">🟢 124 ሰዎች ኦንላይን አሉ</div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <button onClick={() => setScreen('dama')} class="bg-orange-500 h-40 rounded-[2rem] text-white flex flex-col items-center justify-center shadow-xl border-b-8 border-orange-700">
                            <span class="text-5xl mb-2">🎲</span> <span class="text-2xl font-bold">ዳማ</span>
                        </button>
                        <button class="bg-blue-600 h-40 rounded-[2rem] text-white flex flex-col items-center justify-center shadow-xl border-b-8 border-blue-800">
                            <span class="text-5xl mb-2">🌍</span> <span class="text-2xl font-bold">ጠቅላላ እውቀት</span>
                        </button>
                        <button class="bg-purple-600 h-40 rounded-[2rem] text-white flex flex-col items-center justify-center shadow-xl border-b-8 border-purple-800">
                            <span class="text-5xl mb-2">⛪</span> <span class="text-2xl font-bold">መንፈሳዊ እውቀት</span>
                        </button>
                        <button class="bg-green-600 h-40 rounded-[2rem] text-white flex flex-col items-center justify-center shadow-xl border-b-8 border-green-800">
                            <span class="text-5xl mb-2">📖</span> <span class="text-2xl font-bold">ትምህርታዊ ጥያቄ</span>
                        </button>
                    </div>
                </div>
            );

            if (screen === 'dama') return (
                <div class="flex flex-col items-center p-4 min-h-screen bg-amber-50">
                    <button onClick={() => setScreen('dashboard')} class="mb-6 bg-white px-6 py-2 rounded-xl shadow font-bold self-start">⬅ ተመለስ</button>
                    <div class="grid grid-cols-8 w-[340px] h-[340px] md:w-[480px] md:h-[480px] border-[10px] border-amber-950 shadow-2xl rounded-lg overflow-hidden">
                        {board.map((cell, i) => (
                            <div key={i} onClick={() => handleMove(i)} class={`flex items-center justify-center cursor-pointer ${ (Math.floor(i/8) + (i%8)) % 2 === 0 ? 'bg-amber-100' : 'bg-amber-800' } ${selectedSquare === i ? 'ring-4 ring-yellow-400 inset' : ''}`}>
                                {cell === 'red' && <div class="w-[80%] h-[80%] bg-red-600 rounded-full border-4 border-red-800 shadow-md"></div>}
                                {cell === 'white' && <div class="w-[80%] h-[80%] bg-gray-100 rounded-full border-4 border-gray-300 shadow-md"></div>}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AmdeWancha />);
    </script>
</body>
</html>
