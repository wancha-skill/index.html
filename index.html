<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amde-ዋንጫ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes colorChange {
            0% { color: #16a34a; } 50% { color: #facc15; } 100% { color: #dc2626; }
        }
        .animate-title { animation: colorChange 3s infinite; }
        .dama-board { display: grid; grid-template-columns: repeat(8, 1fr); width: 320px; height: 320px; border: 5px solid #451a03; }
        .cell { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .piece { width: 30px; height: 30px; rounded: 50%; border-radius: 50%; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <div id="auth-screen" class="flex flex-col items-center justify-center min-h-screen">
        <h1 class="text-5xl font-black mb-8 animate-title text-center">Amde-ዋንጫ</h1>
        <div class="bg-white p-8 rounded-[2rem] shadow-2xl w-80 border-b-8 border-yellow-500">
            <input type="text" placeholder="ሙሉ ስም" class="w-full p-3 mb-4 border rounded-xl outline-none">
            <input type="text" placeholder="ስልክ ቁጥር" class="w-full p-3 mb-4 border rounded-xl outline-none">
            <input type="password" placeholder="ሚስጥር ቃል" class="w-full p-3 mb-6 border rounded-xl outline-none">
            <button onclick="showScreen('dashboard')" class="w-full bg-orange-500 text-white p-3 rounded-xl font-bold text-xl">ግባ / ተመዝገብ</button>
        </div>
    </div>

    <div id="dashboard-screen" class="hidden p-6 text-center">
        <h1 class="text-3xl font-black mb-6">አምደ-ዋንጫ</h1>
        <div class="bg-green-100 text-green-700 px-6 py-2 rounded-full inline-block mb-8 font-bold border border-green-300">🟢 124 ሰዎች ኦንላይን አሉ</div>
        <div class="grid grid-cols-1 gap-4 max-w-xs mx-auto">
            <button onclick="showScreen('dama')" class="bg-orange-500 text-white p-10 rounded-3xl text-2xl font-bold shadow-lg">🎲 ዳማ</button>
            <button class="bg-blue-600 text-white p-6 rounded-3xl font-bold shadow-lg">🌍 ጠቅላላ እውቀት</button>
            <button class="bg-purple-600 text-white p-6 rounded-3xl font-bold shadow-lg">⛪ መንፈሳዊ እውቀት</button>
            <button class="bg-green-600 text-white p-6 rounded-3xl font-bold shadow-lg">📖 ትምህርታዊ ጥያቄ</button>
        </div>
    </div>

    <div id="dama-screen" class="hidden flex flex-col items-center p-4">
        <button onclick="showScreen('dashboard')" class="mb-6 bg-white px-4 py-2 rounded-xl shadow font-bold self-start">⬅ ተመለስ</button>
        <div id="board" class="dama-board shadow-2xl"></div>
        <p class="mt-6 font-bold text-orange-900 bg-orange-100 p-3 rounded-lg">ጠጠር ነክተው ባዶ ቦታ ላይ ያንቀሳቅሱ</p>
    </div>

    <script>
        function showScreen(screenId) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('dama-screen').classList.add('hidden');
            document.getElementById(screenId + '-screen').classList.remove('hidden');
            if(screenId === 'dama') createDama();
        }

        let selected = null;
        let boardData = Array(64).fill(null);

        function createDama() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let i = 0; i < 64; i++) {
                const row = Math.floor(i / 8);
                const col = i % 8;
                const isDark = (row + col) % 2 !== 0;
                
                if (isDark && row < 3) boardData[i] = 'red';
                else if (isDark && row > 4) boardData[i] = 'white';

                const cell = document.createElement('div');
                cell.className = `cell ${isDark ? 'bg-amber-800' : 'bg-amber-100'}`;
                cell.onclick = () => handleClick(i);
                
                if (boardData[i]) {
                    const piece = document.createElement('div');
                    piece.className = `piece ${boardData[i] === 'red' ? 'bg-red-600 border-2 border-red-900' : 'bg-gray-100 border-2 border-gray-400'}`;
                    cell.appendChild(piece);
                }
                boardEl.appendChild(cell);
            }
        }

        function handleClick(i) {
            if (selected === null) {
                if (boardData[i]) {
                    selected = i;
                    document.querySelectorAll('.cell')[i].style.border = "2px solid yellow";
                }
            } else {
                boardData[i] = boardData[selected];
                boardData[selected] = null;
                selected = null;
                createDama();
            }
        }
    </script>
</body>
</html>
