<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wancha Skill | ዋንጫ ስኪል</title>
    <style>
        /* 1. የጀርባ ቀለም - ልክ እንደ ምስሉ ጥቁርና ጥልቅ ሰማያዊ ቅልቅል */
        body {
            font-family: 'Segoe UI', 'Noto Sans Ethiopic', sans-serif;
            background: radial-gradient(circle at center, #1a1c2c 0%, #08090d 100%);
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-container {
            width: 90%;
            max-width: 450px;
            text-align: center;
            padding: 20px;
        }

        /* 2. አርማው - በምስሉ ላይ እንዳለው ተለዋዋጭና የሚያበራ (Neon Style) */
        .brand-logo {
            font-size: 4rem;
            font-weight: 900;
            line-height: 0.9;
            margin-bottom: 20px;
            /* የቀለማት ስብስብ */
            background: linear-gradient(45deg, #00d2ff, #3a7bd5, #ff0055, #00d2ff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* ቀለሙ እንዲንቀሳቀስ */
            animation: shine 4s linear infinite;
            /* በምስሉ ላይ ያለውን የብርሃን ውጤት ለመስጠት */
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.6));
        }

        @keyframes shine {
            to { background-position: 300% center; }
        }

        .brand-amharic {
            font-size: 2.5rem;
            display: block;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* 3. በምስሉ ላይ ያለውን የመስመር ዲዛይን ለመምሰል */
        .slogan-box {
            position: relative;
            margin: 40px 0;
            padding: 25px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            /* በምስሉ ላይ ያለውን ቀይ ቀጥ ያለ መስመር ለመስራት */
            border-left: 5px solid #ff0055;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .slogan-text {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #cfd8dc;
            font-style: italic;
        }

        /* 4. ቁልፎች (Buttons) - ልክ በምስሉ ላይ ባለው ቀለም */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 18px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.3s;
            text-decoration: none;
            color: white;
            display: inline-block;
        }

        .login-btn {
            background: #e94560; /* በምስሉ ላይ ያለው ሮዝ/ቀይ ቀለም */
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }

        .signup-btn {
            background: transparent;
            border: 2px solid #00d2ff; /* በምስሉ ላይ ያለው ሰማያዊ መስመር */
            color: #00d2ff;
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
        }

        /* የታችኛው ቀስት አኒሜሽን */
        .scroll-down {
            margin-top: 30px;
            color: #555;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="brand-logo">
            WANCHA
            <span class="brand-amharic">ዋንጫ-ስኪል</span>
        </div>

        <div class="slogan-box">
            <p class="slogan-text">
                "ታላቅነት በድንገት አይመጣም፤ የብዙ ጥረቶችና የብልሃት ውጤት እንጂ! Wancha Skill ተራ የጨዋታ መድረክ ሳይሆን የሰላ አእምሮ ባለቤቶችና ብልሃተኞች የሚገናኙበት የድል አደባባይ ነው።"
            </p>
        </div>

        <div class="btn-group">
            <a href="#" class="btn login-btn">ይግቡ (Login)</a>
            <a href="#" class="btn signup-btn">ይመዝገቡ (Sign Up)</a>
        </div>

        <div class="scroll-down">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13l5 5 5-5M7 6l5 5 5-5"/></svg>
        </div>
    </div>

</body>
</html>
